name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate synthetic example documents
        run: python examples/generate_examples.py
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t deadline-extractor:ci .
      - name: Smoke test container
        run: |
          docker run -d --name de -p 8000:8000 deadline-extractor:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/extract \
            -H 'content-type: application/json' \
            -d '{"text":"Documents must be submitted within 14 days from receipt.","anchors":{"receipt":"2026-09-14"}}' \
            | tee out.json
          grep -q '"computed_date":"2026-09-28"' out.json
          docker rm -f de
